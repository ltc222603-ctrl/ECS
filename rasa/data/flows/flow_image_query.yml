flows:
  image_product_query:
    name: 图生文商品查询
    always_include_in_prompt: true
    nlu_trigger:
      - intent: image_product_query_intent
    description: >
      当用户上传商品图片，或 metadata.type 为 image_product_query，
      或当前输入中包含 image_product_query 标记，
      或用户提到图片、照片、拍照、相册、看图、识别图片、图中商品时，
      进入该流程。

      该流程优先级高于 pattern_search。
      只要问题依赖图片内容判断，就不要进入知识库搜索。
    steps:
      - action: action_image_product_query
