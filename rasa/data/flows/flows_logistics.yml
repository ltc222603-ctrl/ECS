flows:
  #查询支持的快递公司
  query_logistics_company:
    name: 查询支持的快递公司
    description: 查询系统当前支持的快递公司/物流公司列表，例如顺丰、中通、圆通、申通、韵达、京东物流等。适用于用户询问“支持哪些快递”或“有哪些物流公司可用”的场景。典型说法包括“支持哪些快递公司”“系统支持哪些物流公司”“有哪些快递可以用”“目前支持哪些承运商”“可以选择哪些快递公司”“已接入的物流公司有哪些”。
    steps:
      - action: query_get_logistics_company

  #查询已发货和已签收的订单的物流信息
  query_shipping_order_logistics:
    name: 查询进行中订单物流
    description: 查询进行中订单的物流信息，支持根据快递单号或订单号获取当前物流状态、最新轨迹、承运商、更新时间和预计送达时间。
    steps:
      - set_slots:
        - where_to: action_ask_order_id_shipped # where_to是一个slot，值用于表示不同的标志
      - collect: order_id #执行相应utter_ask_order_id:发现没有，action_ask_order_id
        next:
          - if: slots.order_id !="false" #false：不进行查询订单操作
            then:
              - action: action_get_logistics_info
                next: END
          - else: END

  #投诉物流
  logistics_complaint:
    name: 投诉物流
    description: 用户对物流、发货、配送环节表达不满、催促、抱怨或投诉，包括发货慢、迟迟未发货、物流长时间未更新、包裹未送达、疑似丢件、物流异常、配送延误、快递员服务态度差、配送出错等问题。典型说法包括“快递怎么还没到”“我的包裹一直没更新物流”“物流太慢了，我要投诉”“东西是不是丢了”“快递员态度太差了”“为什么这么久还没发货”“物流信息一直不动”“都好几天了还没发出”“我的订单怎么还在运输中”“已经超过预计送达时间了”“快递怎么一直显示异常”“包裹卡在一个地方好几天了”“配送员根本没联系我就显示签收了”“我没收到货却显示已送达”“快递送错地方了”“这个物流也太离谱了吧”“发货怎么这么慢”“什么时候才能送到”“这么久不派送是什么意思”。
    steps:
      - set_slots:
        - where_to: action_ask_order_id_shipped_delivered # where_to是一个slot，值用于表示不同的标志
      - collect: order_id #执行相应utter_ask_order_id:发现没有，action_ask_order_id
        next:
          - if: slots.order_id !="false" #false：不进行查询订单操作
            then: get_logistics_info #查询指定订单id的物流信息
          - else: END
      - id: get_logistics_info
        action: action_get_logistics_info
      - collect: complaint_content
        next:
          - if: slots.complaint_content ="other"
            then: #用户自定义
              - collect: other_logistics_complaint
                description: 请输入投诉内容
                force_slot_filling: true #只处理槽的命令，不处理其他命令
              - action: action_record_logistics_complaint # 记录物流投诉到数据库
                next: END
          - if: slots.complaint_content !="false"
            then:
              - action: action_record_logistics_complaint # 记录物流投诉到数据库
                next: END
          - else:
              - action: utter_ask_cancel_success
                next: END

