flows:
  pattern_chitchat:
    name: Pattern Chitchat
    description: 当用户进行简短闲聊、寒暄、跑题互动，或插入与主任务弱相关的轻量对话时，使用该流程进行自然回应，但不打断当前主要任务或业务流程。
    steps:
      - action: utter_chitchat_response

  pattern_search:
    name: Pattern Search
    description: |
      当用户提出售前商品咨询、商品推荐、价格查询、预算筛选、品牌型号查询、品类查询、规格属性查询、库存/在售信息查询、事实查询、知识问答、规则说明、政策解释、操作指引等问题，且需要通过商品库或知识库检索来生成答案时，进入该流程。
      用户问“有没有/有哪些/多少钱/价格多少/推荐吗/有推荐的吗/帮我推荐/适合买吗/某个价位左右/某个品牌有哪些/某个品类有哪些”时，只要不是订单、售后、物流等固定业务办理流程，也应进入该检索流程。
      典型表达包括：8000元左右的手机有推荐吗、手机有推荐的吗、香奈儿有哪些推荐的、Redmi 10X 多少钱、白色256GB的手机有哪些、苹果手机有哪几款、小米手机有什么推荐、帮我推荐一款香水。
    steps:
      - action: action_trigger_search

  pattern_cannot_handle:
    name: Pattern Cannot Handle
    description: 当用户请求超出助手当前能力范围，或当前输入无法被正确理解、无法生成有效处理结果、缺少必要条件且无法继续时，进入该流程并向用户说明无法处理。
    steps:
      - action: utter_cannot_handle
