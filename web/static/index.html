<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商智能客服</title>
    <link rel="icon" href="./icon.png">
    <script src="./marked.min.js"></script>
    <script src="./purify.min.js"></script>

    <style>
        :root {
            --border-radius: 16px;
            --primary-color: #3b82f6;
            --background-color: #f8f7f6;
            --shadow-color: #00000056;
            --input-box-bg-color: #ffffffcb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Consolas", "微软雅黑", sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: var(--background-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        #dialog-area {
            flex: 1;
            width: 100%;
            max-width: 900px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        /* ===== 新增：消息行（头像 + 气泡容器） ===== */
        .message-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 16px;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.bot {
            justify-content: flex-start;
        }

        /* ===== 新增：头像 ===== */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #e5e7eb;
        }

        .message-bubble {
            display: inline-flex;
            padding: 12px;
            border-radius: var(--border-radius);
            font-size: 16px;
            line-height: 1.5;
            word-break: break-word;
            max-width: 70%;
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .message-bubble {
                max-width: 85%;
                font-size: 15px;
            }

            .avatar {
                width: 32px;
                height: 32px;
            }
        }

        .new-message {
            animation: messageAppear 0.3s ease;
        }

        @keyframes messageAppear {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .user-message {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .bot-message {
            background-color: #ffffff;
            color: black;
            box-shadow: 0 2px 4px var(--shadow-color);
        }

        .input-box {
            width: 100%;
            max-width: 900px;
            padding: 16px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 8px var(--shadow-color);
            position: sticky;
            bottom: 16px;
            background-color: var(--input-box-bg-color);
            border: 2px solid transparent;
        }

        .composer-row {
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            width: 100%;
        }

        #attach-btn {
            width: 38px;
            height: 38px;
            border: 1px solid #d1d5db;
            border-radius: 50%;
            background: #fff;
            color: var(--primary-color);
            font-size: 26px;
            line-height: 1;
            cursor: pointer;
            flex-shrink: 0;
        }

        #attach-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .attach-menu {
            position: absolute;
            left: 0;
            bottom: 48px;
            display: none;
            flex-direction: column;
            min-width: 120px;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #d1d5db;
            background: #fff;
            box-shadow: 0 8px 24px #0000002e;
            z-index: 10;
        }

        .attach-menu.open {
            display: flex;
        }

        .attach-menu button {
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            text-align: left;
            cursor: pointer;
            font-size: 15px;
        }

        .attach-menu button:hover {
            background: #eff6ff;
        }

        .image-preview {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            background: #fff;
        }

        .image-preview.show {
            display: flex;
        }

        .image-preview img {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .image-preview span {
            flex: 1;
            font-size: 14px;
            color: #374151;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .image-preview button {
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 22px;
            cursor: pointer;
        }

        .message-image {
            width: 180px;
            max-width: 100%;
            border-radius: 12px;
            object-fit: cover;
            margin-bottom: 8px;
        }

        #user-input {
            flex: 1;
            width: auto;
            padding: 8px;
            font-size: 16px;
            max-height: 200px;
            min-height: 38px;
            overflow-y: auto;
            resize: none;
            border: none;
            outline: none;
            background-color: transparent;
        }

        #send-btn {
            padding: 8px 16px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
            background-color: var(--primary-color);
        }

        .loading-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .loader {
            width: 30px;
            height: 30px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .markdown-content {
            max-width: 100%;
            overflow-x: auto;
        }

        .markdown-content br {
            display: none;
        }

        .markdown-content pre {
            background-color: #f6f8fa;
            padding: 1em;
            border-radius: var(--border-radius);
            overflow-x: auto;
        }
        /* ===== 物流 / 普通文本：让气泡变窄变高 ===== */
        .bot-message {
            max-width: 360px;   /* 控制“窄” */
        }

        /* Markdown 内容纵向排 */
        .markdown-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* 列表样式 */
        .markdown-content ul {
            padding-left: 1em;
            margin: 0;
        }

        /* 每一行：ID / 物流号可自动换行 */
        .markdown-content li {
            word-break: break-all;
            white-space: normal;
            line-height: 1.6;
        }

        /* ===== 历史按钮禁用态 ===== */
        .bot-action-btn.disabled,
        .bot-action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #ccc;
            color: #999;
            background-color: #f5f5f5;
        }


    </style>
</head>

<body>
    <div id="dialog-area">
        <!-- 初始客服消息 -->
        <div class="message-row bot">
            <img class="avatar" src="./bot.png">
            <div class="message-bubble bot-message">
                您好！我是电商智能客服，请问有什么需要我帮忙的？
            </div>
        </div>
    </div>

    <div class="input-box">
        <div id="image-preview" class="image-preview">
            <img id="preview-img" alt="已选择的图片">
            <span id="preview-name"></span>
            <button type="button" onclick="clearSelectedImage()">×</button>
        </div>
        <div class="composer-row">
            <button id="attach-btn" type="button" aria-label="添加图片">+</button>
            <div id="attach-menu" class="attach-menu">
                <button type="button" onclick="openCameraPicker()">拍照</button>
                <button type="button" onclick="openGalleryPicker()">相册</button>
            </div>
            <textarea id="user-input" placeholder="需要我做什么？"></textarea>
            <button id="send-btn" onclick="sendMessage()">发送</button>
        </div>
        <input id="camera-input" type="file" accept="image/*" capture="environment" hidden>
        <input id="gallery-input" type="file" accept="image/*" hidden>
        <!-- 开发调试用：切换用户 -->
        <!-- <button onclick="switchUser()">切换用户</button> -->
    </div>

    <script>
        const dialogArea = document.getElementById('dialog-area');
        const input = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const attachBtn = document.getElementById('attach-btn');
        const attachMenu = document.getElementById('attach-menu');
        const cameraInput = document.getElementById('camera-input');
        const galleryInput = document.getElementById('gallery-input');
        const imagePreview = document.getElementById('image-preview');
        const previewImg = document.getElementById('preview-img');
        const previewName = document.getElementById('preview-name');
        const loadingBubble = createLoadingBubble();
        let selectedImage = null;

        marked.setOptions({ breaks: false });

        // 回车发送，Shift + 回车换行
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();   // 阻止换行
                sendMessage();        // 触发发送
            }
        });

        attachBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            attachMenu.classList.toggle('open');
        });

        document.addEventListener('click', function () {
            attachMenu.classList.remove('open');
        });

        cameraInput.addEventListener('change', function () {
            handleImageSelected(cameraInput.files[0]);
            cameraInput.value = '';
        });

        galleryInput.addEventListener('change', function () {
            handleImageSelected(galleryInput.files[0]);
            galleryInput.value = '';
        });

        // ===== 新增：获取 / 生成 userId（不影响原逻辑） =====
        function getUserId() {
            let userId = localStorage.getItem('userId');
            if (!userId) {
                userId = 'user_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                localStorage.setItem('userId', userId);
            }
            return userId;
        }

        const USER_ID = getUserId();

        // 可选：切换用户（开发测试用）
        function switchUser() {
            const newUserId = 'user_' + Date.now();
            localStorage.setItem('userId', newUserId);
            location.reload();
        }

        function openCameraPicker() {
            attachMenu.classList.remove('open');
            cameraInput.click();
        }

        function openGalleryPicker() {
            attachMenu.classList.remove('open');
            galleryInput.click();
        }

        async function handleImageSelected(file) {
            if (!file || !file.type.startsWith('image/')) return;

            try {
                selectedImage = await resizeImage(file);
                previewImg.src = selectedImage.dataUrl;
                previewName.textContent = file.name || '图片';
                imagePreview.classList.add('show');
            } catch (e) {
                addMessage('图片读取失败，请重新选择', false);
            }
        }

        function clearSelectedImage() {
            selectedImage = null;
            previewImg.removeAttribute('src');
            previewName.textContent = '';
            imagePreview.classList.remove('show');
        }

        function resizeImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = reject;
                reader.onload = function () {
                    const img = new Image();
                    img.onerror = reject;
                    img.onload = function () {
                        const maxSide = 1280;
                        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.max(1, Math.round(img.width * scale));
                        canvas.height = Math.max(1, Math.round(img.height * scale));

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                        resolve({
                            name: file.name || 'image.jpg',
                            type: 'image/jpeg',
                            size: file.size,
                            dataUrl: canvas.toDataURL('image/jpeg', 0.85)
                        });
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // 发送消息
        async function sendMessage(payloadText = null) {
            const message = payloadText ?? input.value.trim();
            const imageToSend = payloadText ? null : selectedImage;
            if (!message && !imageToSend) return;

            sendBtn.disabled = true;
            attachBtn.disabled = true;

            // 如果是用户输入（不是按钮 payload）
            if (!payloadText) {
                addMessage(message || '请识别这张图片', true, imageToSend?.dataUrl);
                input.value = '';
                input.style.height = 'auto';
                clearSelectedImage();
            }

            dialogArea.appendChild(loadingBubble);
            window.scrollTo(0, document.body.scrollHeight);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: USER_ID,
                        message: message,
                        image: imageToSend
                    })
                });

                const data = await response.json();
                loadingBubble.remove();

                if (data.messages && Array.isArray(data.messages)) {
                    data.messages.forEach(msg => {
                        addBotMessage(msg);
                    });
                } else if (data.message) {
                    addMessage(data.message, false);
                } else {
                    addMessage('⚠️ 未知格式的响应', false);
                }

            } catch (e) {
                loadingBubble.remove();
                addMessage('Rasa 服务暂时不可用，请稍后再试', false);
            }

            sendBtn.disabled = false;
            attachBtn.disabled = false;
        }

        function addBotMessage(msg) {
            const row = document.createElement('div');
            row.className = 'message-row bot';

            const avatar = document.createElement('img');
            avatar.className = 'avatar';
            avatar.src = './bot.png';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble bot-message';

            // ⭐⭐⭐ 关键：强制纵向布局
            bubble.style.display = 'flex';
            bubble.style.flexDirection = 'column';
            bubble.style.alignItems = 'stretch'; // 子元素占满宽度

            /* ===== ① 标题：请选择订单（单独一行） ===== */
            if (msg.text) {
                const header = document.createElement('div');

                // ⭐⭐⭐ 核心：Markdown + 自动换行
                const html = DOMPurify.sanitize(marked.parse(msg.text));
                header.innerHTML = `<div class="markdown-content">${html}</div>`;

                header.style.marginBottom = '12px';
                header.style.width = '100%';

                bubble.appendChild(header);
            }


            /* ===== ② 中间：订单按钮列表 ===== */
            if (msg.buttons && msg.buttons.length > 0) {

                const listWrap = document.createElement('div');
                listWrap.style.display = 'flex';
                listWrap.style.flexDirection = 'column';
                listWrap.style.gap = '8px';
                listWrap.style.width = '100%';

                msg.buttons.forEach(btn => {
                    if (btn.title === '返回') return;

                    const button = document.createElement('button');
                    button.className = 'bot-action-btn';   // ⭐ 标记这是“可操作按钮”
                    button.textContent = btn.title;


                    button.style.width = '100%';            // ❗ 每行一个
                    button.style.textAlign = 'left';
                    button.style.padding = '10px 12px';
                    button.style.borderRadius = '12px';
                    button.style.border = '1px solid #3b82f6';
                    button.style.background = '#fff';
                    button.style.cursor = 'pointer';
                    button.style.boxSizing = 'border-box';

                    button.onclick = () => {
                        disableAllBotActionButtons();   // ⭐ 用户一点击，立刻锁死所有按钮
                        sendMessage(btn.payload);
                    };


                    listWrap.appendChild(button);
                });

                bubble.appendChild(listWrap);

                /* ===== ③ 底部：返回按钮（单独一行，右对齐） ===== */
                const backBtn = msg.buttons.find(b => b.title === '返回');
                if (backBtn) {
                    const footer = document.createElement('div');
                    footer.style.marginTop = '14px';
                    footer.style.display = 'flex';
                    footer.style.justifyContent = 'flex-start';
                    footer.style.width = '100%';

                    const backButton = document.createElement('button');
                    backButton.className = 'bot-action-btn';   // ⭐ 这一行是关键
                    backButton.textContent = '返回';
                    backButton.style.padding = '6px 16px';
                    backButton.style.borderRadius = '999px';
                    backButton.style.border = '1px solid #999';
                    backButton.style.background = '#f5f5f5';
                    backButton.style.cursor = 'pointer';
                    backButton.style.width = 'fit-content';   // ⭐ 新增这一行

                    backButton.onclick = () => {
                        disableAllBotActionButtons();   // ⭐ 和其他按钮一致
                        sendMessage(backBtn.payload);
                    };


                    footer.appendChild(backButton);
                    bubble.appendChild(footer);
                }
            }

            row.appendChild(avatar);
            row.appendChild(bubble);
            dialogArea.appendChild(row);
            window.scrollTo(0, document.body.scrollHeight);
        }




        // 创建加载状态的气泡
        function createLoadingBubble() {
            const row = document.createElement('div');
            row.className = 'message-row bot';

            const avatar = document.createElement('img');
            avatar.className = 'avatar';
            avatar.src = './bot.png';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble bot-message';

            const loading = document.createElement('div');
            loading.className = 'loading-container';

            const loader = document.createElement('div');
            loader.className = 'loader';

            loading.appendChild(loader);
            loading.appendChild(document.createTextNode('正在思索中...'));
            bubble.appendChild(loading);

            row.appendChild(avatar);
            row.appendChild(bubble);
            return row;
        }

        // 添加消息
        function addMessage(content, isUser, imageDataUrl = null) {
            const row = document.createElement('div');
            row.className = 'message-row ' + (isUser ? 'user' : 'bot');

            const avatar = document.createElement('img');
            avatar.className = 'avatar';
            avatar.src = isUser ? './user.png' : './bot.png';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble ' + (isUser ? 'user-message' : 'bot-message');

            if (isUser) {
                bubble.style.flexDirection = 'column';
                if (imageDataUrl) {
                    const img = document.createElement('img');
                    img.className = 'message-image';
                    img.src = imageDataUrl;
                    img.alt = '用户上传的图片';
                    bubble.appendChild(img);
                }
                if (content) {
                    const text = document.createElement('div');
                    text.textContent = content;
                    bubble.appendChild(text);
                }
                row.appendChild(bubble);
                row.appendChild(avatar);
            } else {
                // ⭐⭐⭐ 关键改动：bot 普通文本 → Markdown
                const html = DOMPurify.sanitize(marked.parse(content));
                bubble.innerHTML = `<div class="markdown-content">${html}</div>`;

                row.appendChild(avatar);
                row.appendChild(bubble);
            }

            dialogArea.appendChild(row);
            window.scrollTo(0, document.body.scrollHeight);
        }

        function disableAllBotActionButtons() {
            // 添加“禁用所有历史按钮”的函数
            const buttons = document.querySelectorAll('.bot-action-btn');

            buttons.forEach(btn => {
                btn.disabled = true;
                btn.classList.add('disabled');
            });
        }


    </script>
</body>

</html>
